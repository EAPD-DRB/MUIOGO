name: User manual

on:
  push:
    branches: [main]
    paths:
      - "docs/source/**"
      - "docs/requirementsrtd.txt"
      - ".readthedocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/source/**"
      - "docs/requirementsrtd.txt"
      - ".readthedocs.yml"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  html:
    name: Build and check documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install documentation tools
        run: python -m pip install -r docs/requirementsrtd.txt
      - name: Build HTML with strict reference checks
        run: python -m sphinx -b html -n -W --keep-going docs/source docs/build/html
      - name: Upload HTML preview
        uses: actions/upload-artifact@v7
        with:
          name: muiogo-user-manual
          path: docs/build/html/
