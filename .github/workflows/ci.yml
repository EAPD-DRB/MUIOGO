name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            # Convert UTF-16/invalid-encoded requirements.txt to UTF-8 if it contains NUL bytes
            if grep -q $'\x00' requirements.txt; then
              echo "Converting requirements.txt from UTF-16/invalid encoding to UTF-8"
              iconv -f utf-16 -t utf-8 requirements.txt > requirements.utf8 && mv requirements.utf8 requirements.txt
            fi
            pip install -r requirements.txt
          fi

      - name: Install dev dependencies
        run: pip install ruff pytest pytest-cov

      - name: Run tests with coverage
        run: pytest --maxfail=1 --disable-warnings --cov=API
