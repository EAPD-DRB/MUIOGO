name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check API/ tests/

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fix requirements encoding
        run: |
          python - <<'EOF'
          import pathlib
          data = pathlib.Path("requirements.txt").read_bytes()
          if b"\x00" in data:
              text = data.decode("utf-16")
              pathlib.Path("requirements.txt").write_text(text, encoding="utf-8")
              print("Converted requirements.txt from UTF-16 to UTF-8")
          else:
              print("requirements.txt encoding OK")
          EOF

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test tools
        run: pip install "pytest>=7" pytest-cov

      - name: Run tests
        run: pytest --cov=API --cov-report=term-missing --cov-fail-under=5

  oglink:
    name: Test (oglink linker)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: oglink

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the linker in its own environment
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linker tests
        run: pytest

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fix requirements encoding
        run: |
          python - <<'EOF'
          import pathlib
          data = pathlib.Path("requirements.txt").read_bytes()
          if b"\x00" in data:
              text = data.decode("utf-16")
              pathlib.Path("requirements.txt").write_text(text, encoding="utf-8")
              print("Converted requirements.txt from UTF-16 to UTF-8")
          else:
              print("requirements.txt encoding OK")
          EOF

      - name: Install GLPK solver (required at app startup)
        run: |
          sudo apt-get update
          sudo apt-get install -y glpk-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=7" pytest-playwright

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run e2e smoke tests
        run: pytest tests/e2e -v --screenshot on --full-page-screenshot --tracing retain-on-failure

      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore
