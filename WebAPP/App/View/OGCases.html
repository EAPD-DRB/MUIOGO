<div class="ogc-page" id="ogcCasesPage">

  <h1 class="ogc-title" id="ogcCasesTitle">Country workspace</h1>
  <div class="ogc-sub" id="ogcCasesSub">Cases and parameters are isolated to this country calibration.</div>

  <div class="ogc-srcnote" id="ogcCasesNote" style="display: none;"><i class="fa fa-info-circle"></i> No calibration is installed yet. Install one from the OG-Core home before creating a case.</div>

  <div class="ogc-ctxbar">
    <span class="ogc-country-summary">
      <span class="ogc-country-flag" id="ogcWorkspaceFlag"></span>
      <span class="ogc-country-copy">
        <b id="ogcWorkspaceName"></b>
        <span class="ogc-country-code" id="ogcWorkspaceId"></span>
      </span>
    </span>
    <span class="ogc-summary-stat"><b id="ogcBaselineCount">0</b> <span id="ogcBaselineLabel">baselines</span></span>
    <span class="ogc-summary-stat"><b id="ogcReformCount">0</b> <span id="ogcReformLabel">reforms</span></span>
    <span class="ogc-bar-right">
      <a class="btn ogc-btn" href="#/OGCore" title="Close this country workspace and return to the country list"><i class="fa fa-sign-out"></i> Exit workspace</a>
      <button class="btn ogc-btn ogc-btn-main" data-act="new-case" title="Create a baseline or reform for this country"><i class="fa fa-plus"></i> Add case</button>
    </span>
  </div>

  <div class="ogc-bar">
    <span class="ogc-bar-h"><i class="fa fa-list-alt"></i> Cases</span>
    <span class="ogc-bar-right">
      <span class="ogc-search"><i class="fa fa-search"></i><input id="ogcCaseSearch" type="search" placeholder="Search cases..."></span>
      <button class="btn ogc-btn" data-act="layout" title="Switch between grouping reforms with their baseline and splitting them by type"><i class="fa fa-columns"></i> <span id="ogcLayoutLabel">Split baselines and reforms</span></button>
    </span>
  </div>

  <div id="ogcCasesContent"></div>

  <!-- shared dialog: new case, reform, and delete confirmations -->
  <div class="ogc-modal" id="ogcCasesModal" style="display: none;">
    <div class="ogc-box">
      <div class="ogc-box-head" id="ogcCasesModalHead"></div>
      <div class="ogc-box-body" id="ogcCasesModalBody"></div>
      <div class="ogc-box-foot" id="ogcCasesModalFoot"></div>
    </div>
  </div>

</div>
