[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "API.Classes.Base.Config",
    "API.Classes.Base.FileClass",
    "API.Classes.Base.CustomExceptionClass",
    "API.Classes.Base.CustomThreadClass",
    "API.Classes.Base.SyncS3",
]
disallow_untyped_defs = true
warn_return_any = true
